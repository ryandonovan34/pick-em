# Alembic configuration file.
# The sqlalchemy.url value here is intentionally left as a placeholder.
# alembic/env.py reads the real URL from app.config.settings so it always
# matches whatever DATABASE_URL is set in .env — no need to duplicate it here.

[alembic]
script_location = alembic
prepend_sys_path = .

# Logging — set to WARNING in CI to reduce noise.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
